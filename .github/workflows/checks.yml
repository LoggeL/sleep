name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: docker build -t nachtplan:ci .
      - run: docker run -d -p 5187:80 --name nachtplan-ci nachtplan:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
